# tmux window layout for `new_tmux_session`: like default-session.conf but without
# the Kaimon pane, and with a plain jailed-julia instead of the Kaimon-served
# jailed-julia-repl, so several sessions can run concurrently.
#
# Sourced by new_tmux_session with @proj set to the project directory.

rename-window claude
send-keys -t claude "jailed-claude" Enter

new-window -c "#{@proj}" -n shell
send-keys -t shell "jailed-shell" Enter

new-window -c "#{@proj}" -n julia
send-keys -t julia "jailed-julia" Enter

select-window -t claude
